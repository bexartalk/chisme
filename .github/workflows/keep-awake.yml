# Keeps chisme.onrender.com from going to sleep on Render's free plan (it sleeps after ~15 min with no visits, and the
# next visitor then waits ~30-60 s). Every 10 minutes GitHub runs this: it asks /healthz, then asks again 5 minutes
# later, so even when GitHub starts a scheduled run late (it often does, by 5-15 min) the gap stays under 15 minutes.
# Free: public repo (Actions minutes don't count) + Render's 750 free hours a month (one service running 24/7 = ~744).
# Run it by hand: Actions → "Keep Chisme awake" → Run workflow. Turn it off: Actions → … → Disable workflow.
# Note: GitHub pauses scheduled workflows in a public repo after 60 days with no commits; it emails a re-enable link.
name: Keep Chisme awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/keep-awake.yml"]
permissions: {}
concurrency:
  group: keep-awake
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Ping /healthz now and again in 5 minutes
        run: |
          ping() {
            for i in 1 2 3 4; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 70 -A "chisme-keep-awake (GitHub Actions)" https://chisme.onrender.com/healthz) || code=000
              echo "$(date -u +%H:%M:%SZ) try $i: HTTP $code"
              [ "$code" = 200 ] && return 0
              sleep 15
            done
            echo "::warning::chisme.onrender.com/healthz didn't answer 200 after 4 tries"
            return 0
          }
          ping
          sleep 300
          ping
