<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00C9CD">
  <title>Moderation · Chisme</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/static/icons/favicon-32.png">
  <!-- The owner's moderation queue (/stats/social). The social app itself lives inside the main app (index.html). -->
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/social.css">
</head>
<body class="sx sx-plain" data-mode="mod">
  <header class="topbar sx-modbar"><div class="wrap"><a href="/stats" class="sx-modlink">‹ Stats</a></div><div class="picado" aria-hidden="true"></div></header>
  <main id="view" class="wrap" tabindex="-1" aria-live="polite"></main>
  <div class="sx sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-card"><div class="grab" aria-hidden="true"></div><h2 id="sheet-title"></h2><div id="sheet-body"></div>
      <button type="button" class="x" id="sheet-x" aria-label="Close">✕</button></div>
  </div>
  <div class="sx toast" id="toast" role="status" hidden></div>
  <script src="/static/social.js" defer></script>
</body>
</html>
