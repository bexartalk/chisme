<linearGradient id="k" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB27A"/><stop offset=".45" stop-color="#C45200"/><stop offset=".55" stop-color="#C0C0C0"/><stop offset="1" stop-color="#6E2400"/></linearGradient>
</defs>
