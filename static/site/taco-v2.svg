<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 32"><!-- v49.22 Golden Taco badge: a side-view hard-shell taco lying on its side (the fold down-right, the opening up-left), lettuce, tomato, orange cheddar and beef poking out; a glittery metallic orange-gold shell (copper, #FF6A0B, peach, silver; never yellow); a big WHITE check with a metallic orange-gold edge; white sparkles -->
<defs>
<linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB27A"/><stop offset=".25" stop-color="#FF8A3D"/><stop offset=".48" stop-color="#FF6A0B"/><stop offset=".58" stop-color="#E8E8EA"/><stop offset=".68" stop-color="#FF8A3D"/><stop offset="1" stop-color="#8A2E00"/></linearGradient>
