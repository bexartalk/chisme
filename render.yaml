services:
  - type: web
    name: chisme
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_USER_AGENT
        value: "Chisme/1.0 (https://github.com/bexartalk/chisme)"
      # Web Push (see README → "Alerts setup"). sync: false = set the value in the Render dashboard, never in git.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_TICK_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # v42: the owner's private /stats page (open /stats?key=<ADMIN_TOKEN> once). Without it, /stats is a 404.
      - key: ADMIN_TOKEN
        sync: false
      # Tía Chismosa's AI (see README → "Tía Chismosa"). Without it she uses scripted lines.
      - key: GEMINI_API_KEY
        sync: false
      # v49.13: Chisme's public address for share links, the share promo line and link previews (Open Graph), e.g.
      # https://chisme.co once that domain points here. Unset = each request's own address (works on chisme.onrender.com).
      - key: PUBLIC_BASE_URL
        sync: false
      # v49.14 desktop website / domain move (README → "Desktop website & the move to chisme.co"). All optional, off by default:
      # PUBLIC_BASE_URL (above) also drives the desktop canonical/OG/sitemap/QR; DOMAIN_REDIRECT=1 (301 old host → it),
      # MOVED_BANNER=1 (tell installed users on the old origin to re-add Chisme), REDIRECT_FROM_HOSTS, APP_STORE_GOAL_RAISED.
