services:
  - type: web
    name: chisme
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_USER_AGENT
        value: "Chisme/1.0 (https://github.com/bexartalk/chisme)"
      # Web Push (see README → "Alerts setup"). sync: false = set the value in the Render dashboard, never in git.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_TICK_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # v42: the owner's private /stats page (open /stats?key=<ADMIN_TOKEN> once). Without it, /stats is a 404.
      - key: ADMIN_TOKEN
        sync: false
      # Tía Chismosa's AI (see README → "Tía Chismosa"). Without it she uses scripted lines.
      - key: GEMINI_API_KEY
        sync: false
